# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[workspace]
members = ["game","dev_tools"]

[workspace.dependencies]
bevy = { version = "0.20.1", default-features = true}
avian2d = "0.8.0"
bevy_ecs_ldtk = "0.16.0"