[package]
name = "magic_dodgeball"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = "0.8.0"
bevy_framepace = "0.22.0"

bevy = { version = "0.20.1", default-features = true} 
bevy_ecs_ldtk = "0.16.0"
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[workspace]
members = ["game_core", "dev_tools", "game", "systems"]
