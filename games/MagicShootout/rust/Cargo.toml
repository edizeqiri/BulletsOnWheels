[package]
name = "bullets_on_wheels"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_state","bevy_asset","bevy_log"] }
godot = "0.5"
rand = "0.9.2"
glam = "0.30.9"
test-case = "3.3.1"
enum_delegate = "0.2.0"
cargo-godot-lib = "0.2.1"
godot-bevy-macros = { git = "https://github.com/edizeqiri/godot-bevy", rev = "929d252" }
bevy_asset_loader = "0.27.0-rc.1"

# Desktop: godot-bevy with default features (includes `experimental-threads`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
godot-bevy = { git = "https://github.com/edizeqiri/godot-bevy", rev = "929d252" }

# Web (Godot/emscripten) build only.
#
# - godot-bevy: drop `experimental-threads` (it forces `godot/experimental-threads`,
#   which is incompatible with a nothreads Wasm build) and `bevy_gamepad`
#   (`bevy_gilrs` uses the browser Gamepad API via web-sys, which panics inside
#   Godot's Emscripten wasm runtime).
# - godot: `experimental-wasm` + `experimental-wasm-nothreads` to match a Godot
#   web export with Thread Support OFF. The threaded path needs Rust std rebuilt
#   with atomics (-Zbuild-std) + emscripten -pthread; nothreads keeps it simple,
#   and Bevy here is single-threaded anyway (no `multi_threaded` feature).
# - wasm-bindgen 0.2.109 added an `UnwindSafe` bound on `Closure::new` (PR #4893)
#   that the latest `web-task 1.1.3` (pulled in by `bevy_tasks`) does not satisfy.
#   0.2.108 is the highest version that still compiles, and its paired
#   `js-sys 0.3.85` meets `wgpu-types`' `>=0.3.85` floor. The lockstep `=` deps
#   between these crates pull js-sys/web-sys/futures along.
[target.'cfg(target_arch = "wasm32")'.dependencies]
godot-bevy = { git = "https://github.com/edizeqiri/godot-bevy", rev = "929d252", default-features = false, features = ["godot_bevy_log"] }
godot = { version = "0.5", features = ["experimental-wasm", "experimental-wasm-nothreads"] }
wasm-bindgen = "=0.2.108"

core_engine = { path = "../../../core_engine" }
